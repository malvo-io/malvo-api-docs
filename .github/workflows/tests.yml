name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ fromJSON(vars.MALVO_SELF_HOSTED_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64","malvo-ci"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/generate_reference.py --check
      - run: python3 -m unittest discover -s tests
